version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: artist_promo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}@postgres:5432/artist_promo
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET?set JWT_SECRET in .env}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - RATE_LIMIT_PER_MINUTE=60
      - API_KEYS=${API_KEYS?set API_KEYS in .env}
    depends_on:
      - postgres
      - redis
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload

  scrape-worker:
    build: .
    environment:
      - DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}@postgres:5432/artist_promo
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: python cli.py start-worker scrape

  normalize-worker:
    build: .
    environment:
      - DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}@postgres:5432/artist_promo
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: python cli.py start-worker normalize

  enrich-worker:
    build: .
    environment:
      - DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}@postgres:5432/artist_promo
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: python cli.py start-worker enrich

  graph-worker:
    build: .
    environment:
      - DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}@postgres:5432/artist_promo
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: python cli.py start-worker graph

  outreach-worker:
    build: .
    environment:
      - DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD in .env}@postgres:5432/artist_promo
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-smtp}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    depends_on:
      - postgres
      - redis
    command: python cli.py start-worker outreach

volumes:
  redis_data:
  postgres_data: